<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Log Expense | Investor's Bucket</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&family=Inter:wght@400;500;600;700&family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@100..900&family=Plus+Jakarta+Sans:wght@100..900&display=swap" rel="stylesheet"/>
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .glass-effect {
            background: rgba(255, 255, 255, 0.8);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
        }
        .scan-line {
            height: 2px;
            background: linear-gradient(90deg, transparent, #065f46, transparent);
            animation: scan 3s ease-in-out infinite;
        }
        @keyframes scan {
            0% { top: 0%; opacity: 0; }
            10% { opacity: 1; }
            90% { opacity: 1; }
            100% { top: 100%; opacity: 0; }
        }
    </style>

            theme: {

                    "colors": {
                        "secondary-container": "#fea619",
                        "inverse-on-surface": "#f1f1f0",
                        "on-background": "#1a1c1c",
                        "error-container": "#ffdad6",
                        "tertiary-container": "#575250",
                        "surface-container-high": "#e8e8e7",
                        "on-secondary-container": "#684000",
                        "on-secondary-fixed-variant": "#653e00",

                        "secondary": "#855300",
                        "tertiary-fixed": "#e9e1dd",
                        "surface": "#f9f9f8",
                        "on-tertiary-container": "#cdc6c2",

                        "surface-container-low": "#f3f4f3",
                        "primary-fixed-dim": "#8bd6b6",

                        "outline-variant": "#bec9c2",

                        "surface-variant": "#e2e2e2",
                        "on-secondary": "#ffffff",
                        "on-primary": "#ffffff",
                        "on-tertiary": "#ffffff",
                        "surface-container-lowest": "#ffffff",
                        "secondary-fixed-dim": "#ffb95f",
                        "on-tertiary-fixed-variant": "#4a4643",
                        "surface-dim": "#dadad9",
                        "error": "#ba1a1a",

                    "borderRadius": {
                        "DEFAULT": "0.25rem",

                    "spacing": {

                        "tap-target-min": "48px",
                        "stack-gap": "16px",
                        "container-padding": "20px",
                        "base": "4px"
                    },
                    "fontFamily": {
                        "label-md": ["Inter"],
                        "headline-md": ["Plus Jakarta Sans"],

                        "label-md": ["12px", {"lineHeight": "16px", "letterSpacing": "0.05em", "fontWeight": "600"}],

            },
        }

<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-surface font-body-md text-on-surface min-h-screen pb-32">
<!-- Top Navigation (Shell Supressed as per Task Logic - Sub-page with back action) -->
<header class="flex justify-between items-center px-container-padding h-tap-target-min w-full sticky top-0 z-50 bg-surface/80 backdrop-blur-md">
<button aria-label="Go back" class="w-12 h-12 flex items-center justify-start text-primary active:scale-95 transition-transform">
<span class="material-symbols-outlined">arrow_back</span>
</button>
<h1 class="font-headline-sm text-headline-sm text-primary font-bold">Log Expense</h1>
<div class="w-12 h-12"></div> <!-- Spacer for symmetry -->
</header>
<main class="px-container-padding space-y-stack-gap mt-4">
<!-- Status Badge -->
<div class="flex justify-center">
<div class="inline-flex items-center gap-2 px-4 py-1.5 bg-primary-fixed rounded-full shadow-sm">
<span class="material-symbols-outlined text-[18px] text-primary" data-weight="fill">check_circle</span>
<span class="font-label-md text-label-md text-primary uppercase tracking-wider">OCR Extracted</span>
</div>
</div>
<!-- Receipt Camera Preview Section -->
<section class="relative overflow-hidden rounded-[20px] shadow-[0_4px_12px_rgba(6,95,70,0.05)] border border-outline-variant/30 bg-surface-container h-64 flex items-center justify-center">
<div class="absolute inset-0 w-full h-full bg-cover bg-center opacity-80" data-alt="A macro close-up shot of a crumpled, handwritten paper receipt resting on a dark wooden texture. The lighting is warm and directional, casting soft shadows that highlight the tactile quality of the paper. A digital green scanning line overlay glows across the center, giving a high-tech fintech OCR feel. The atmosphere is professional yet approachable, fitting a modern corporate startup tool." style="background-image: url('https://lh3.googleusercontent.com/aida-public/AB6AXuApdPAcm8W5jkjwy_q7K9BIulW4-iazgmv0tfRFts3Z9_Qr2GlHTycLzI4cTELwAHCmaFSRy3HHmgAXiknQeECno-OqbUi4PA5UCipHgYQBbT9shWfcByqMfttH49q09XmdkOiB-hsYemxcrZqd3JLVPpAF9v8TJ_Jp7yErD7sjAjn4NnV04grl5GZuVWDm7Bw6pea9uw4-6KmCZP1rPzGz-uPEHXW3q5_SzOdW4BIlcVR48NNQw6wW')">
</div>
<!-- Scanning Animation Overlay -->
<div class="absolute inset-0 pointer-events-none">
<div class="scan-line absolute w-full top-0"></div>
<div class="absolute inset-0 border-[2px] border-primary/20 rounded-[20px] m-4"></div>
<!-- Recognition Corners -->
<div class="absolute top-6 left-6 w-8 h-8 border-t-4 border-l-4 border-primary rounded-tl-lg"></div>
<div class="absolute top-6 right-6 w-8 h-8 border-t-4 border-r-4 border-primary rounded-tr-lg"></div>
<div class="absolute bottom-6 left-6 w-8 h-8 border-b-4 border-l-4 border-primary rounded-bl-lg"></div>
<div class="absolute bottom-6 right-6 w-8 h-8 border-b-4 border-r-4 border-primary rounded-br-lg"></div>
</div>
<!-- Retake Action -->
<button class="absolute bottom-4 right-4 glass-effect p-3 rounded-full shadow-lg border border-white/50 active:scale-90 transition-all">
<span class="material-symbols-outlined text-primary">camera_alt</span>
</button>
</section>
<!-- Editable Confirmation Card -->
<section class="bg-surface-container-lowest p-card-inner-padding rounded-[20px] shadow-[0_8px_20px_rgba(6,95,70,0.08)] border border-outline-variant/40 space-y-4">
<div class="flex items-center justify-between">
<h2 class="font-headline-sm text-headline-sm text-on-surface">Review Details</h2>
<span class="material-symbols-outlined text-outline">edit_note</span>
</div>
<div class="space-y-4">
<!-- Date Input -->
<div class="relative">
<label class="block font-label-md text-label-md text-on-surface-variant mb-1">Date</label>
<div class="flex items-center gap-3 p-3 bg-surface-container-low rounded-xl border-b-2 border-primary-container">
<span class="material-symbols-outlined text-primary text-[20px]">calendar_today</span>
<input class="bg-transparent border-none p-0 w-full font-body-md text-on-surface focus:ring-0" type="text" value="Oct 24, 2023"/>
</div>
</div>
<!-- Vendor Input -->
<div class="relative">
<label class="block font-label-md text-label-md text-on-surface-variant mb-1">Vendor</label>
<div class="flex items-center gap-3 p-3 bg-surface-container-low rounded-xl border-b-2 border-primary-container">
<span class="material-symbols-outlined text-primary text-[20px]">store</span>
<input class="bg-transparent border-none p-0 w-full font-body-md text-on-surface focus:ring-0" type="text" value="Raj Hardware"/>
</div>
</div>
<!-- Amount Input -->
<div class="relative">
<label class="block font-label-md text-label-md text-on-surface-variant mb-1">Amount</label>
<div class="flex items-center gap-3 p-3 bg-surface-container-low rounded-xl border-b-2 border-primary-container">
<span class="text-primary font-bold text-lg">₹</span>
<input class="bg-transparent border-none p-0 w-full font-currency-display text-currency-display text-on-surface focus:ring-0" type="text" value="12,450"/>
</div>
</div>
</div>
</section>
<!-- Category Picker -->
<section class="space-y-3">
<h3 class="font-label-md text-label-md text-on-surface-variant uppercase tracking-widest px-1">Select Category</h3>
<div class="flex flex-wrap gap-2">
<!-- Chips -->
<button class="px-4 py-2 rounded-full border border-outline-variant text-on-surface-variant font-label-md text-label-md hover:bg-surface-container transition-colors active:scale-95">
                    Lease & Deposit
                </button>
<button class="px-4 py-2 rounded-full bg-primary-container text-on-primary-container font-label-md text-label-md border border-primary-container shadow-sm flex items-center gap-1.5 active:scale-95 transition-all">
<span class="material-symbols-outlined text-[16px]" data-weight="fill">check</span>
                    Interiors
                </button>
<button class="px-4 py-2 rounded-full border border-outline-variant text-on-surface-variant font-label-md text-label-md hover:bg-surface-container transition-colors active:scale-95">
                    Inventory
                </button>
<button class="px-4 py-2 rounded-full border border-outline-variant text-on-surface-variant font-label-md text-label-md hover:bg-surface-container transition-colors active:scale-95">
                    Licenses
                </button>
<button class="px-4 py-2 rounded-full border border-outline-variant text-on-surface-variant font-label-md text-label-md hover:bg-surface-container transition-colors active:scale-95">
                    Marketing
                </button>
</div>
</section>
<!-- Extra Note -->
<section class="bg-surface-container-low p-4 rounded-xl border-l-4 border-secondary-container">
<div class="flex gap-3">
<span class="material-symbols-outlined text-secondary text-[20px]">lightbulb</span>
<p class="text-body-sm font-body-sm text-on-surface-variant">This expense will be deducted from your <span class="font-bold text-primary">Office Setup Bucket</span>.</p>
</div>
</section>
</main>
<!-- Bottom CTA Bar -->
<div class="fixed bottom-0 left-0 right-0 p-container-padding bg-surface/90 backdrop-blur-lg border-t border-outline-variant/20 z-50">
<button class="w-full bg-primary-container h-14 rounded-full flex items-center justify-center gap-3 text-on-primary shadow-lg active:scale-[0.98] transition-all hover:brightness-110">
<span class="font-headline-sm text-headline-sm text-on-primary">Log for Approval</span>
<span class="material-symbols-outlined">send</span>
</button>
<!-- Home indicator for mobile -->
<div class="mt-4 flex justify-center">
<div class="w-32 h-1 bg-outline-variant/50 rounded-full"></div>
</div>
</div>
<script>
        // Micro-interaction for chips
        document.querySelectorAll('button[class*="rounded-full"]').forEach(chip => {
            if (!chip.closest('div[class*="fixed"]')) { // Exclude main CTA
                chip.addEventListener('click', function() {
                    // Logic to toggle selection UI
                    if (!this.classList.contains('bg-primary-container')) {
                        // Deselect others (simplified)
                        document.querySelectorAll('button[class*="bg-primary-container"]').forEach(c => {
                           if(!c.classList.contains('fixed')) {
                                c.className = "px-4 py-2 rounded-full border border-outline-variant text-on-surface-variant font-label-md text-label-md hover:bg-surface-container transition-colors active:scale-95";
                                const checkIcon = c.querySelector('.material-symbols-outlined');
                                if(checkIcon) checkIcon.remove();
                           }
                        });
                        
                        // Select this
                        this.className = "px-4 py-2 rounded-full bg-primary-container text-on-primary-container font-label-md text-label-md border border-primary-container shadow-sm flex items-center gap-1.5 active:scale-95 transition-all";
                        const span = document.createElement('span');
                        span.className = "material-symbols-outlined text-[16px]";
                        span.setAttribute('data-weight', 'fill');
                        span.textContent = 'check';
                        this.prepend(span);
                    }
                });
            }
        });
    </script>
</body></html>
