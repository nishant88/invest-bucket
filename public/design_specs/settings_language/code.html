<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
            display: inline-block;
            line-height: 1;
            text-transform: none;
            letter-spacing: normal;
            word-wrap: normal;
            white-space: nowrap;
            direction: ltr;
        }
        body {
            background-color: #f9f9f8;
            -webkit-font-smoothing: antialiased;
        }
        .card-shadow {
            box-shadow: 0 4px 12px rgba(6, 95, 70, 0.05);
        }
        .bento-card {
            background: #ffffff;
            border: 1px solid #e7e5e4;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }
        .bento-card:active {
            transform: scale(0.98);
        }
    </style>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "secondary-container": "#fea619",
                        "inverse-on-surface": "#f1f1f0",
                        "on-background": "#1a1c1c",
                        "error-container": "#ffdad6",
                        "tertiary-container": "#575250",
                        "surface-container-high": "#e8e8e7",
                        "on-secondary-container": "#684000",
                        "on-secondary-fixed-variant": "#653e00",
                        "surface-bright": "#f9f9f8",
                        "on-error-container": "#93000a",
                        "surface-tint": "#1b6b51",
                        "on-primary-fixed": "#002116",
                        "on-tertiary-fixed": "#1e1b19",
                        "on-surface-variant": "#3f4944",
                        "primary": "#004532",
                        "secondary": "#855300",
                        "tertiary-fixed": "#e9e1dd",
                        "surface": "#f9f9f8",
                        "on-tertiary-container": "#cdc6c2",
                        "tertiary": "#3f3b39",
                        "surface-container-low": "#f3f4f3",
                        "primary-fixed-dim": "#8bd6b6",
                        "inverse-surface": "#2f3130",
                        "outline-variant": "#bec9c2",
                        "inverse-primary": "#8bd6b6",
                        "surface-variant": "#e2e2e2",
                        "on-secondary": "#ffffff",
                        "on-primary": "#ffffff",
                        "on-tertiary": "#ffffff",
                        "surface-container-lowest": "#ffffff",
                        "secondary-fixed-dim": "#ffb95f",
                        "on-tertiary-fixed-variant": "#4a4643",
                        "surface-dim": "#dadad9",
                        "error": "#ba1a1a",
                        "primary-container": "#065f46",
                        "background": "#f9f9f8",
                        "tertiary-fixed-dim": "#ccc5c2",
                        "on-primary-fixed-variant": "#00513b",
                        "on-primary-container": "#8bd6b7",
                        "outline": "#6f7973",
                        "surface-container": "#eeeeed",
                        "on-error": "#ffffff",
                        "on-secondary-fixed": "#2a1700",
                        "primary-fixed": "#a6f2d1",
                        "on-surface": "#1a1c1c",
                        "secondary-fixed": "#ffddb8",
                        "surface-container-highest": "#e2e2e2"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    "spacing": {
                        "card-inner-padding": "20px",
                        "tap-target-min": "48px",
                        "stack-gap": "16px",
                        "container-padding": "20px",
                        "base": "4px"
                    },
                    "fontFamily": {
                        "label-md": ["Inter"],
                        "headline-md": ["Plus Jakarta Sans"],
                        "display-lg": ["Plus Jakarta Sans"],
                        "body-lg": ["Inter"],
                        "headline-sm": ["Plus Jakarta Sans"],
                        "body-md": ["Inter"],
                        "body-sm": ["Inter"],
                        "currency-display": ["Inter"]
                    },
                    "fontSize": {
                        "label-md": ["12px", {"lineHeight": "16px", "letterSpacing": "0.05em", "fontWeight": "600"}],
                        "headline-md": ["24px", {"lineHeight": "32px", "letterSpacing": "-0.01em", "fontWeight": "600"}],
                        "display-lg": ["32px", {"lineHeight": "40px", "letterSpacing": "-0.02em", "fontWeight": "700"}],
                        "body-lg": ["18px", {"lineHeight": "28px", "fontWeight": "400"}],
                        "headline-sm": ["20px", {"lineHeight": "28px", "fontWeight": "600"}],
                        "body-md": ["16px", {"lineHeight": "24px", "fontWeight": "400"}],
                        "body-sm": ["14px", {"lineHeight": "20px", "fontWeight": "400"}],
                        "currency-display": ["28px", {"lineHeight": "32px", "fontWeight": "700"}]
                    }
                },
            },
        }
    </script>
</head>
<body class="bg-surface text-on-surface font-body-md">
<!-- Top App Bar -->
<header class="flex justify-between items-center px-container-padding h-tap-target-min w-full fixed top-0 z-50 bg-surface dark:bg-surface-dim shadow-[0_4px_12px_rgba(6,95,70,0.05)]">
<div class="flex items-center gap-3">
<div class="w-8 h-8 rounded-full overflow-hidden bg-primary-fixed">
<img class="w-full h-full object-cover" data-alt="A professional studio portrait of a young Indian entrepreneur, clean lighting, soft warm bokeh background, professional attire, high resolution, modern corporate aesthetic." src="https://lh3.googleusercontent.com/aida-public/AB6AXuClRg3-x2ofmHl0nbTGjD3RwVjCP8cYP9EX1Zf_V4C8bzgghgg1VB8CG3FJVsDweeRDPbi43wuKReMopKdLbERAwU1nYuXb6kydjSga5HrOmr6VCIPn_q0WvmGINCihg2OAwlVxkiYMWJkixCVwdDjYQMQNW1ctAW-OULc00M5AmvUpcO_RQ44JpCxbXvh1ur5fQO1MNjDJNBR0ArZ_iHg2EdEgq_2chcn5OAB1r4wheGMYxTY4VAmY"/>
</div>
<h1 class="text-headline-sm font-headline-sm font-bold text-primary dark:text-primary-fixed-dim">Investor's Bucket</h1>
</div>
<button class="w-10 h-10 flex items-center justify-center rounded-full hover:bg-surface-container transition-colors">
<span class="material-symbols-outlined text-primary" data-icon="notifications">notifications</span>
</button>
</header>
<main class="pt-20 pb-28 px-container-padding space-y-stack-gap">
<!-- Profile Header Section -->
<section class="flex flex-col items-center py-6">
<div class="relative group">
<div class="w-24 h-24 rounded-full border-4 border-primary-fixed-dim p-1">
<img class="w-full h-full rounded-full object-cover" data-alt="A high-quality profile image of a tech professional in a bright, modern office setting with lush green plants in the background, warm natural lighting, professional photography style." src="https://lh3.googleusercontent.com/aida-public/AB6AXuA54mxb57F_i_hIRs2oEpX5zGhRdq7lRpegIYOoUjyQw-WuVMF0lc_mfDvdIs2OkbjM_L8BRTS8HBQZk5onNGk5HL7b1q-jI6Pv2jWGXOgYzK3GwwGr1e7-Tdm4e8jnss41nIxJQAUsf4SbEAgAEXkSCipmmsFlJ5Vz9ex6jlFsr89bVAWhOBbBPlq-aLkturkNPcgINTZQA1C8pYSwqRyEn9xvH9RK9AH5A94-Jc-b-fNSLoq2Ktqs"/>
</div>
<div class="absolute bottom-0 right-0 bg-primary text-on-primary w-8 h-8 rounded-full flex items-center justify-center border-2 border-white">
<span class="material-symbols-outlined text-[18px]" data-icon="edit">edit</span>
</div>
</div>
<h2 class="mt-4 font-headline-md text-headline-md text-on-surface">Arjun Sharma</h2>
<p class="font-body-sm text-on-surface-variant">arjun.sharma@startupindia.com</p>
</section>
<!-- WhatsApp Bot Bento Card -->
<section class="bento-card rounded-2xl p-card-inner-padding relative overflow-hidden">
<div class="absolute top-0 right-0 -mt-4 -mr-4 w-24 h-24 bg-primary/5 rounded-full blur-2xl"></div>
<div class="flex items-start gap-4">
<div class="bg-[#25D366]/10 p-3 rounded-xl">
<span class="material-symbols-outlined text-[#25D366] text-3xl" data-icon="chat">chat</span>
</div>
<div class="flex-1">
<h3 class="font-headline-sm text-headline-sm text-on-surface">WhatsApp Bot</h3>
<p class="font-body-sm text-on-surface-variant mt-1">Connect WhatsApp to log expenses on the go with zero effort.</p>
<button class="mt-4 h-[44px] px-6 bg-primary text-on-primary rounded-full font-label-md text-label-md hover:bg-primary-container transition-all flex items-center gap-2">
<span>Link Now</span>
<span class="material-symbols-outlined text-sm" data-icon="arrow_forward">arrow_forward</span>
</button>
</div>
</div>
</section>
<!-- Language Switcher Section -->
<section class="space-y-4">
<h3 class="font-label-md text-label-md text-on-surface-variant px-1 uppercase tracking-wider">App Language</h3>
<div class="flex flex-wrap gap-3">
<!-- English -->
<button class="px-5 py-3 rounded-full bg-primary-container text-on-primary-container font-label-md text-label-md flex items-center gap-2 border border-primary/10 shadow-sm transition-all scale-95 ring-2 ring-primary">
<span class="material-symbols-outlined text-sm" data-icon="check_circle" style="font-variation-settings: 'FILL' 1;">check_circle</span>
                    English
                </button>
<!-- Hindi -->
<button class="px-5 py-3 rounded-full bg-white text-on-surface-variant font-label-md text-label-md border border-outline-variant hover:bg-surface-container-low transition-all">
                    हिन्दी
                </button>
<!-- Hinglish -->
<button class="px-5 py-3 rounded-full bg-white text-on-surface-variant font-label-md text-label-md border border-outline-variant hover:bg-surface-container-low transition-all">
                    Hinglish
                </button>
<!-- Marathi -->
<button class="px-5 py-3 rounded-full bg-white text-on-surface-variant font-label-md text-label-md border border-outline-variant hover:bg-surface-container-low transition-all">
                    मराठी
                </button>
<!-- Tamil -->
<button class="px-5 py-3 rounded-full bg-white text-on-surface-variant font-label-md text-label-md border border-outline-variant hover:bg-surface-container-low transition-all">
                    தமிழ்
                </button>
<!-- Telugu -->
<button class="px-5 py-3 rounded-full bg-white text-on-surface-variant font-label-md text-label-md border border-outline-variant hover:bg-surface-container-low transition-all">
                    తెలుగు
                </button>
</div>
</section>
<!-- Profile Settings List -->
<section class="bento-card rounded-2xl overflow-hidden divide-y divide-outline-variant/30 shadow-sm">
<button class="w-full flex items-center justify-between p-card-inner-padding hover:bg-surface-container-low transition-colors">
<div class="flex items-center gap-4">
<span class="material-symbols-outlined text-on-surface-variant" data-icon="person">person</span>
<span class="font-body-md text-on-surface">Personal Information</span>
</div>
<span class="material-symbols-outlined text-outline" data-icon="chevron_right">chevron_right</span>
</button>
<button class="w-full flex items-center justify-between p-card-inner-padding hover:bg-surface-container-low transition-colors">
<div class="flex items-center gap-4">
<span class="material-symbols-outlined text-on-surface-variant" data-icon="security">security</span>
<span class="font-body-md text-on-surface">Security &amp; Privacy</span>
</div>
<span class="material-symbols-outlined text-outline" data-icon="chevron_right">chevron_right</span>
</button>
<button class="w-full flex items-center justify-between p-card-inner-padding hover:bg-surface-container-low transition-colors">
<div class="flex items-center gap-4">
<span class="material-symbols-outlined text-on-surface-variant" data-icon="account_balance">account_balance</span>
<span class="font-body-md text-on-surface">Bank Accounts</span>
</div>
<span class="material-symbols-outlined text-outline" data-icon="chevron_right">chevron_right</span>
</button>
<button class="w-full flex items-center justify-between p-card-inner-padding hover:bg-surface-container-low transition-colors">
<div class="flex items-center gap-4">
<span class="material-symbols-outlined text-on-surface-variant" data-icon="help">help</span>
<span class="font-body-md text-on-surface">Help &amp; Support</span>
</div>
<span class="material-symbols-outlined text-outline" data-icon="chevron_right">chevron_right</span>
</button>
</section>
<!-- Logout Action -->
<section class="pt-4">
<button class="w-full flex items-center justify-center gap-2 p-card-inner-padding rounded-2xl border-2 border-error/20 text-error font-headline-sm text-headline-sm hover:bg-error-container/20 transition-all active:scale-95">
<span class="material-symbols-outlined" data-icon="logout">logout</span>
                Logout
            </button>
<p class="text-center mt-6 font-body-sm text-outline text-[11px] uppercase tracking-widest">Version 2.4.0 (Build 892)</p>
</section>
</main>
<!-- Bottom Navigation Bar -->
<nav class="fixed bottom-0 w-full z-50 flex justify-around items-center px-4 py-2 bg-surface dark:bg-inverse-surface shadow-lg rounded-t-xl">
<a class="flex flex-col items-center justify-center text-on-surface-variant dark:text-outline-variant px-4 py-1 hover:bg-surface-container-low transition-all" href="#">
<span class="material-symbols-outlined" data-icon="dashboard">dashboard</span>
<span class="font-label-md text-label-md">Home</span>
</a>
<a class="flex flex-col items-center justify-center text-on-surface-variant dark:text-outline-variant px-4 py-1 hover:bg-surface-container-low transition-all" href="#">
<span class="material-symbols-outlined" data-icon="receipt_long">receipt_long</span>
<span class="font-label-md text-label-md">Expenses</span>
</a>
<a class="flex flex-col items-center justify-center text-on-surface-variant dark:text-outline-variant px-4 py-1 hover:bg-surface-container-low transition-all" href="#">
<span class="material-symbols-outlined" data-icon="store">store</span>
<span class="font-label-md text-label-md">Vendors</span>
</a>
<!-- Active Tab: More -->
<a class="flex flex-col items-center justify-center bg-primary-container dark:bg-primary-fixed-variant text-on-primary-container dark:text-primary-fixed rounded-full px-4 py-1 scale-90 transition-all" href="#">
<span class="material-symbols-outlined" data-icon="more_horiz" style="font-variation-settings: 'FILL' 1;">more_horiz</span>
<span class="font-label-md text-label-md">More</span>
</a>
</nav>
<script>
        // Micro-interaction for language chips
        document.querySelectorAll('section:nth-of-type(3) button').forEach(button => {
            button.addEventListener('click', function() {
                // Reset others
                document.querySelectorAll('section:nth-of-type(3) button').forEach(b => {
                    b.classList.remove('bg-primary-container', 'text-on-primary-container', 'ring-2', 'ring-primary', 'scale-95');
                    b.classList.add('bg-white', 'text-on-surface-variant');
                    const icon = b.querySelector('.material-symbols-outlined');
                    if (icon) icon.remove();
                });
                
                // Set active
                this.classList.remove('bg-white', 'text-on-surface-variant');
                this.classList.add('bg-primary-container', 'text-on-primary-container', 'ring-2', 'ring-primary', 'scale-95');
                
                const checkIcon = document.createElement('span');
                checkIcon.className = 'material-symbols-outlined text-sm';
                checkIcon.dataset.icon = 'check_circle';
                checkIcon.style.fontVariationSettings = "'FILL' 1";
                checkIcon.textContent = 'check_circle';
                this.prepend(checkIcon);
            });
        });
    </script>
</body></html>
